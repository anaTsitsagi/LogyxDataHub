# Defaults for a production-like install. values-local.yaml overrides them for the local cluster.
# No secret values here: they come from an existing Secret (secrets.existingSecret).

image:
  # Registry prefix, e.g. "registry.example.ge/datahub"; empty = local images named datahub-<app>.
  registry: ""
  # Empty = .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# ASPNETCORE_ENVIRONMENT / DOTNET_ENVIRONMENT. "Local" turns on dev tokens and the dev Swagger document.
environment: Production

secrets:
  # Created outside the chart (by TBC, or by scripts/local/k8s-up.ps1). Each key is the environment
  # variable it becomes, e.g. ConnectionStrings__DataHub, Security__SigningKey, S3__SecretKey, RabbitMq__Uri.
  existingSecret: datahub-secrets

# Non-secret settings for every app (a ConfigMap, loaded as environment variables).
config:
  Invitations__PortalBaseUrl: ""
  S3__Bucket: ""
  S3__Region: eu-central-1
  # Largest ORIS journal table (WIRING.TPS) accepted, in bytes: 55 MB fits apps.worker's 2Gi memory limit.
  # Raise both together (worker memory ~ 350 MiB + 28 MiB per MB of WIRING.TPS; docs/resource-estimate.md).
  Uploads__MaxJournalBytes: "57671680"
  RabbitMq__QueueType: quorum
  Smtp__Host: ""
  Smtp__Port: "587"
  Smtp__Security: StartTls
  Smtp__From: ""
  # OTLP/HTTP receiver base address; empty = console only. Otlp__Headers (e.g. an API key) goes in the Secret.
  Otlp__Endpoint: ""
  Otlp__ExportMetrics: "true"

# Settings shared by web, api and worker pods.
pod:
  # Container port of every app (the image sets ASPNETCORE_HTTP_PORTS=8080).
  port: 8080
  securityContext:
    runAsNonRoot: true
    runAsUser: 1654
    runAsGroup: 1654
    fsGroup: 1654
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Optional host folder for the SMS outbox (local testing only; the real SMS gateway is still open with TBC).
smsOutbox:
  hostPath: ""

apps:
  web:
    enabled: true
    replicas: 2
    # Behind the ingress: trust X-Forwarded-Proto/For so HTTPS-only cookies and per-IP rate limits work.
    env:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      RabbitMq__ClientName: datahub-web
    secretKeys: [ConnectionStrings__DataHub, Security__SigningKey, S3__AccessKey, S3__SecretKey, RabbitMq__Uri, Smtp__Username, Smtp__Password, Otlp__Headers]
    service: true
    tmpSizeLimit: 1Gi
    # Measured: idle ~20m / 190-225 MiB; peak ~1.15 cores / 227 MiB while receiving uploads (5 at once).
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }
  api:
    enabled: true
    replicas: 2
    env:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      RabbitMq__ClientName: datahub-api
      # TBC's identity provider (OpenID Connect issuer); required outside the Local environment.
      Auth__Authority: ""
    secretKeys: [ConnectionStrings__DataHub, Security__SigningKey, S3__AccessKey, S3__SecretKey, RabbitMq__Uri, Smtp__Username, Smtp__Password, Otlp__Headers, Auth__DevSigningKey]
    service: true
    tmpSizeLimit: 1Gi
    # Measured: idle ~4m / 145-170 MiB; peak ~0.7 core / 187 MiB (report queries during imports).
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }
  worker:
    enabled: true
    replicas: 1
    env:
      RabbitMq__ClientName: datahub-worker
      Processing__TempDirectory: /tmp/datahub-worker
    secretKeys: [ConnectionStrings__DataHub, Security__SigningKey, S3__AccessKey, S3__SecretKey, RabbitMq__Uri, Smtp__Username, Smtp__Password, Otlp__Headers]
    service: false
    # An in-flight job hands itself back within the app's 25 s shutdown timeout.
    terminationGracePeriodSeconds: 40
    # The downloaded ZIP (max 2 GB) plus one extracted table at a time (measured: 1,901 MiB for a 1.9 GB ZIP).
    tmpSizeLimit: 3Gi
    # Measured in step 8 (docs/resource-estimate.md): ~300-410 MiB process memory for typical files, plus about
    # 28 MiB per MB of WIRING.TPS (the TPS parser holds the whole table); 2Gi handles WIRING.TPS up to ~55 MB.
    # CPU peaks at ~1.4 cores during an import; no CPU limit, so imports aren't throttled.
    resources:
      requests: { cpu: 500m, memory: 768Mi, ephemeral-storage: 3Gi }
      limits: { memory: 2Gi }
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70

# Applies the EF Core migrations before every install and upgrade (Helm hook Job). The apps roll out only
# if it succeeds.
migrator:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

ingress:
  enabled: true
  className: ""
  # Uploads send 16 MB chunks (the part endpoint accepts up to 64 MB). For ingress-nginx, for example:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  #   nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  annotations: {}
  # TLS certificate Secret for both hosts; empty = the ingress controller's default certificate.
  tlsSecretName: ""
  portalHost: ""
  apiHost: ""
