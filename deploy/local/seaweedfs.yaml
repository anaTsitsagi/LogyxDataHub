# SeaweedFS as the local S3 (MinIO is archived): S3 API on seaweedfs:8333, filer on seaweedfs:8888.
# Access keys (s3.json) and the SSE-S3 key: Secret datahub-local-infra. The SSE key must stay the same,
# or stored uploads become unreadable; scripts/local/k8s-up.ps1 generates it once and keeps it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          command: [/usr/bin/weed]
          args:
            - -logtostderr=true
            - server
            - -dir=/data
            # Components talk over loopback (stable across restarts); clients reach the bound ports.
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            - -master.volumeSizeLimitMB=1024
            - -volume.max=0
          env:
            - name: WEED_S3_SSE_KEY
              valueFrom:
                secretKeyRef: { name: datahub-local-infra, key: seaweedfs-sse-key }
          ports:
            - { name: s3, containerPort: 8333 }
            - { name: filer, containerPort: 8888 }
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            # A 1.9 GB upload took it to the 1Gi limit (544 MiB own memory + file cache).
            limits: { memory: 1536Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: config
          secret:
            secretName: datahub-local-infra
            items:
              - { key: seaweedfs-s3-config, path: s3.json }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 20Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector: { app: seaweedfs }
  ports:
    - { name: s3, port: 8333, targetPort: s3 }
    - { name: filer, port: 8888, targetPort: filer }
---
# In SeaweedFS an S3 bucket is a folder under /buckets on the filer (409 = it already exists).
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-bucket
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: curlimages/curl:latest
          command: [sh, -c]
          args:
            - |
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://seaweedfs:8888/buckets/datahub-uploads/)
              echo "filer answered $code"
              case "$code" in 2*|409) exit 0 ;; *) exit 1 ;; esac
